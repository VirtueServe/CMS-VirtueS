name: Build and deploy Node.js app to Azure Web App - strapi-webapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install and build
        run: |
          npm install
          npm run build --if-present

      # ✅ Prune dev dependencies before packaging
      - name: Prune dev dependencies
        run: npm prune --production

      # ✅ Zip only what's needed — exclude heavy/unnecessary folders
      - name: Zip artifact for deployment
        run: zip -r release.zip . --exclude "*.git*" --exclude "*.github*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip   # ✅ Upload zip, not raw folder

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A3F785BB75841D0BF489D3D461AC51E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A266EF1F1E5D485E837A6E02ED470DF8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_75EF433163884B18A785F56BDDE848AB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'strapi-webapp'
          slot-name: 'Production'
          package: release.zip   # ✅ Deploy the zip
